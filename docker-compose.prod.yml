# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (passar -f explicitamente faz o Compose IGNORAR o docker-compose.override.yml
# de dev, então Postgres/Redis continuam sem porta exposta ao host)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    logging: *default-logging

  redis:
    restart: unless-stopped
    logging: *default-logging

  worker:
    restart: unless-stopped
    logging: *default-logging

  api:
    restart: unless-stopped
    logging: *default-logging
